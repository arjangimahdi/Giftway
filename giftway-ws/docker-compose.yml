services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${PORT:-3333}:3333'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3333
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/giftway}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4200}
    ports:
      - '4200:4200'
    depends_on:
      - api

volumes:
  mongo-data:
